# Talkent 配置文件
# 复制此文件为 config.yaml 并修改

server:
  host: "0.0.0.0"
  port: 8080
  request_timeout: 30s

database:
  path: "./talkent.db"

log:
  level: "info"
  file: ""  # 空字符串表示输出到 stdout

llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"
  api_key: ""  # 建议通过环境变量 TALKENT_LLM_API_KEY 注入
  model: "deepseek-chat"
  timeout: 30s

auth:
  username: "admin"  # 建议通过环境变量 TALKENT_AUTH_USERNAME 注入
  password: "admin"  # 建议通过环境变量 TALKENT_AUTH_PASSWORD 注入
  jwt_secret: "change-me-in-production"  # 生产环境必须通过 TALKENT_AUTH_JWT_SECRET 覆盖
  access_expiry: 1h
  refresh_expiry: 168h  # 7 天
